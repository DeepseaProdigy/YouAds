[project]
name = "orbis-ad-tool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "certifi>=2025.0.0",
  "numpy>=2,<3",
  "openai-agents>=0.0.20",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "reactor-sdk",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
